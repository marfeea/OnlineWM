name: onlinewm

channels:
  - conda-forge
  - defaults

dependencies:
  # Isaac Sim 5.x requires Python 3.11.
  - python=3.11
  - pip>=25,<27
  - importlib_metadata
  - pip:
      # Isaac Lab's build scripts currently require setuptools < 82.
      - "setuptools<82.0.0"
      - wheel
      - toml==0.10.2
      - psutil>=5.9,<8
      - pytest>=8,<10
      - ruff==0.14.10
      - pre-commit>=4,<5

variables:
  # Prevent packages from %APPDATA%/Python/Python311/site-packages from
  # shadowing the versions installed in this environment.
  PYTHONNOUSERSITE: "1"
